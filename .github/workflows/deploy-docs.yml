name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'pages/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Install dependencies
        working-directory: ./pages
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: ./pages
        run: |
          bunx playwright install --with-deps chromium
          echo "✅ Playwright browsers installed"

      - name: Transform documentation
        working-directory: ./pages
        run: |
          node transform-docs.js
          echo "✅ Documentation transformed from ./docs/ to ./pages/src/content/docs/"

      - name: Build site
        working-directory: ./pages
        run: |
          bun run generate-favicon
          bun run transform
          bun run build
          echo "✅ Site built"

      - name: List dist contents (post-build)
        working-directory: ./pages
        run: |
          echo "== Dist tree (post-build) =="
          find dist -maxdepth 2 -type f -print | sort
          echo
          echo "== Dist root listing =="
          ls -la dist || true

      - name: Verify internal links
        working-directory: ./pages
        run: |
          bun run fix-links
          bun run verify
          echo "✅ All internal links verified"

      - name: Archive dist listing (pre-upload)
        working-directory: ./pages
        run: |
          echo "== Archive candidate listing =="
          tar -cf /tmp/dist.tar -C dist .
          tar -tf /tmp/dist.tar | sed -n '1,200p'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./pages/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # v4.0.5

      - name: Summary
        run: |
          echo "## 🎉 Documentation Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Process" >> $GITHUB_STEP_SUMMARY
          echo "1. 📄 Source docs from \`./docs/\`" >> $GITHUB_STEP_SUMMARY
          echo "2. 🔄 Transform to \`./pages/src/content/docs/\`" >> $GITHUB_STEP_SUMMARY
          echo "3. 🏗️  Build Astro site to \`./pages/dist/\`" >> $GITHUB_STEP_SUMMARY
          echo "4. 🔗 Fix and verify internal links" >> $GITHUB_STEP_SUMMARY
          echo "5. 🚀 Deploy to GitHub Pages via Actions" >> $GITHUB_STEP_SUMMARY
